name: SDK checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: sdk-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: iOS SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Swift sources
        run: bash .ci/lint.sh
